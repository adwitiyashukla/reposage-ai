name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,treesitter]"
      - name: Ruff
        run: ruff check src tests evals --output-format=github
      - name: Ruff format check
        run: ruff format --check src tests evals
      - name: Mypy
        run: mypy src/reposage
        continue-on-error: true

  test:
    name: Tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
          - python-version: "3.12"
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,treesitter]"
      # The suite is fully offline: a deterministic fake provider stands in for
      # the model, so CI needs no secrets and no network.
      - name: Test
        run: pytest -q --cov=reposage --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[treesitter]"
      - name: CLI responds
        run: |
          reposage --version
          reposage doctor
          reposage list
      - name: API imports and serves
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from reposage.api.main import create_app
          with TestClient(create_app()) as c:
              assert c.get("/api/health").status_code == 200
              assert c.get("/").status_code == 200
              assert c.get("/openapi.json").status_code == 200
          print("API smoke test passed")
          PY

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: reposage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and reports healthy
        run: |
          docker run -d --name reposage-ci -p 8000:8000 -e GEMINI_API_KEY=ci-placeholder reposage:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              echo "healthy after ${i}s"; curl -s http://127.0.0.1:8000/api/health; exit 0
            fi
            sleep 1
          done
          echo "container failed to become healthy"; docker logs reposage-ci; exit 1
      - name: Stop
        if: always()
        run: docker rm -f reposage-ci || true
