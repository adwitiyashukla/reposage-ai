name: Keep the demo warm

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping the Space
    runs-on: ubuntu-latest
    steps:
      - name: Wake and verify
        env:
          SPACE_URL: https://adwitiyashukla-reposage.hf.space
        run: |
          for attempt in 1 2 3 4 5 6; do
            if body=$(curl -fsS --max-time 90 "${SPACE_URL}/api/health"); then
              echo "Space responded on attempt ${attempt}."
              echo "$body" | head -c 400
              echo
              exit 0
            fi
            echo "Attempt ${attempt} did not succeed; the Space may be starting."
            sleep 30
          done
          echo "::warning::The Space did not respond after 6 attempts. It may be paused or rebuilding."
          exit 0
